<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101726">
  <meta name="description" content="Panel de gestión de productos, stock, marcas, categorías y usuarios de TechManager.">
  <title>TechManager</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>

  <dialog id="app-modal" class="modal">
    <div class="modal-frame">
      <div class="modal-heading">
        <div>
          <p class="eyebrow" id="modal-eyebrow">TechManager</p>
          <h2 id="modal-title">Formulario</h2>
        </div>
        <button class="icon-button" type="button" data-close-modal aria-label="Cerrar ventana">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </dialog>

  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>

  <noscript>Necesitás activar JavaScript para usar TechManager.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
